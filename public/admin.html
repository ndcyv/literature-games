<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Literature Games · Admin</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--wash)}
header{background:var(--plum);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.brand{font-family:var(--disp);font-weight:800;font-size:1.1rem}
.brand span{color:var(--gold)}
nav{display:flex;gap:8px}
nav button{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);padding:.5em 1.2em;font-size:.95rem}
nav button.on{background:var(--gold);color:var(--plum);border-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:1.8rem;margin:0 0 6px;color:var(--plum)}
h2{font-size:1.25rem;margin:0;color:var(--plum)}
.muted{color:var(--muted)}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:.95rem;line-height:1.5}
.banner.warn{background:#FFF1D6;border:1px solid var(--gold)}
.banner.ok{background:#E3F5EC;border:1px solid #9BD3B6}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;position:sticky;top:80px}
.list button{text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;font-size:.95rem;padding:.6em .9em;display:flex;justify-content:space-between;gap:8px}
.list button.on{border-color:var(--plum);background:var(--plum);color:#fff}
.list button small{font-family:var(--text);font-weight:400;opacity:.8}
.list button .bad{color:var(--red)}
.list button.on .bad{color:#FFB3BE}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label,.lbl{font-family:var(--disp);font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f small{color:var(--muted);font-size:.82rem}
input,textarea,select{font:inherit;font-size:1rem;padding:.55em .7em;border-radius:10px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}
textarea{min-height:5.5em;resize:vertical;line-height:1.45}
.q{border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;background:#fff}
.q.bad{border-color:#F3B3BD;background:#FFF7F8}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qh b{font-family:var(--disp);color:var(--plum)}
.tag{font-family:var(--disp);font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;background:#FDE3E7;color:var(--red)}
.tools{display:flex;gap:6px}
.tools button,.small{font-size:.8rem;padding:.45em .9em;background:var(--wash);color:var(--plum);border:1px solid var(--line)}
.danger{background:#FDE3E7!important;color:var(--red)!important}
.media{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.media img{max-height:110px;border-radius:8px;border:1px solid var(--line)}
.media audio{height:36px}
.mkwrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;align-self:flex-start;width:fit-content}
.mkwrap img{max-width:100%;max-height:340px;display:block;border-radius:10px}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--plum);font-family:var(--disp);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(42,23,64,.6);font-size:.9rem}
.mk.right{background:var(--green);color:#fff}
.items{display:grid;gap:8px}
.items .it{display:grid;grid-template-columns:1fr 120px auto;gap:8px}
.bar{position:sticky;bottom:0;background:rgba(247,243,250,.95);padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);margin-top:18px}
.status{font-family:var(--disp);font-weight:700;color:var(--green)}
.status.err{color:var(--red)}
.plan{border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:#fff}
.entry{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.entry .n{font-family:var(--disp);font-weight:800;color:var(--plum)}
.qpick{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px}
.qpick label{display:flex;gap:4px;align-items:center;font-size:.85rem;background:var(--wash);border-radius:8px;padding:3px 8px;cursor:pointer}
.qpick input{width:auto}
.login{max-width:420px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
code{background:var(--wash);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<header><div class="brand">The <span>Literature</span> Games · Admin</div><nav id="nav" class="hidden"><button data-tab="plans" class="on">Day plans</button><button data-tab="games">Games and questions</button></nav></header>
<main id="m"></main>
<script>
const $m = document.getElementById("m");
let PW = sessionStorage.getItem("lg-pw") || "", D = null, tab = "plans", curGame = null, dirty = false;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, opts = {}) => { const r = await fetch(path, { ...opts, headers: { "x-admin-password": PW, ...(opts.headers || {}) } }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ---------- question forms ----------
const F = (path, label, kind = "text", help = "") => ({ path, label, kind, help });
const SCHEMA = {
  text: [F("category", "Category (optional)"), F("prompt", "Question", "textarea"), F("answer", "Answer"), F("accept", "Also accept", "list", "Other spellings or forms, separated by commas"), F("image", "Picture (optional)", "image"), F("audio", "Sound (optional)", "audio")],
  spell: [F("prompt", "Clue", "textarea"), F("answer", "Answer (must be spelled exactly)")],
  code: [F("category", "Category"), F("answer", "Answer (the code is made from it automatically)"), F("accept", "Also accept", "list")],
  pairs: [F("clues.0", "Clue 1", "textarea"), F("parts.0.answer", "Answer 1"), F("parts.0.accept", "Also accept for answer 1", "list"), F("clues.1", "Clue 2", "textarea"), F("parts.1.answer", "Answer 2"), F("parts.1.accept", "Also accept for answer 2", "list")],
  steps: [F("steps", "Clues, one per line (they appear one by one)", "lines"), F("answer", "Answer"), F("accept", "Also accept", "list")],
  redact: [F("prompt", "Question", "textarea", "Put hidden words in double square brackets, e.g. Which [[Jane Austen]] novel …? They appear one by one."), F("answer", "Answer"), F("accept", "Also accept", "list")],
  posh: [F("posh", "Posh question", "textarea"), F("poshImage", "Picture for the posh question (optional)", "image"), F("pop", "Pop question", "textarea"), F("popImage", "Picture for the pop question (optional)", "image"), F("answer", "Answer (same for both)"), F("accept", "Also accept", "list")],
  choice: [F("prompt", "Question"), F("image", "Picture", "image"), F("markers", "Numbered spots", "markers", "Click on the picture to add a numbered spot. Click a spot to remove it.")],
  order: [F("prompt", "Instruction"), F("items", "Events (any order; the year decides the answer)", "items")],
  closest: [F("prompt", "Question", "textarea"), F("answer", "Answer (a number)", "number"), F("unit", "Unit (optional, e.g. km)")],
  unique: [F("category", "Category"), F("answers", "All correct answers, one per line", "lines")],
  hint: [F("category", "Category"), F("answer", "Answer card"), F("accept", "Also accept", "list")],
};
const BLANK = { pairs: () => ({ clues: ["", ""], parts: [{ answer: "", accept: [] }, { answer: "", accept: [] }] }), order: () => ({ prompt: "Put these in order, earliest first.", items: [1, 2, 3, 4].map(() => ({ label: "", year: "" })) }), choice: () => ({ prompt: "", markers: [] }), steps: () => ({ steps: [], answer: "", accept: [] }), unique: () => ({ category: "", answers: [] }) };
const get = (o, p) => p.split(".").reduce((x, k) => (x == null ? x : x[k]), o);
const set = (o, p, v) => { const ks = p.split("."); let x = o; ks.slice(0, -1).forEach((k, i) => { if (x[k] == null) x[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; x = x[k]; }); x[ks[ks.length - 1]] = v; };

function playable(type, q) {
  const has = (v) => v != null && String(v).trim() !== "";
  switch (type) {
    case "pairs": return (q.clues || []).every(has) && (q.parts || []).every((p) => has(p.answer));
    case "choice": return has(q.image) && (q.markers || []).length && has(q.answer);
    case "order": return (q.items || []).length >= 2 && q.items.every((i) => has(i.label) && has(i.year));
    case "closest": return has(q.prompt) && has(q.answer) && !isNaN(Number(q.answer));
    case "unique": return has(q.category) && (q.answers || []).length;
    case "hint": return has(q.answer);
    case "steps": return (q.steps || []).length && has(q.answer);
    case "posh": return has(q.posh) && has(q.pop) && has(q.answer);
    default: return (has(q.prompt) || has(q.category) || has(q.image) || has(q.audio)) && has(q.answer) && !(q.needs === "audio" && !q.audio);
  }
}
function missing(type, q) { if (q.needs === "audio" && !q.audio) return "needs a sound file"; if (type === "choice" && !q.answer) return "choose the right number"; return playable(type, q) ? "" : "incomplete"; }

// ---------- login ----------
function login(msg) {
  document.getElementById("nav").classList.add("hidden");
  $m.innerHTML = `<div class="login"><h1>Admin</h1><p class="muted">Plan your class days and edit the questions.</p><label class="lbl" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="status err">${esc(msg || "")}</div><button id="go">Sign in</button></div>`;
  const go = async () => { PW = document.getElementById("pw").value; await load(); };
  document.getElementById("go").onclick = go; document.getElementById("pw").onkeydown = (e) => e.key === "Enter" && go(); document.getElementById("pw").focus();
}
async function load() {
  try { D = await api("/api/admin/data"); } catch (e) { sessionStorage.removeItem("lg-pw"); return login(e.message); }
  sessionStorage.setItem("lg-pw", PW); document.getElementById("nav").classList.remove("hidden"); render();
}
document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => { if (dirty && !confirmLeave()) return; tab = b.dataset.tab; document.querySelectorAll("#nav button").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
function confirmLeave() { return true; } // unsaved edits stay in memory until saved
function banner() {
  return D.mode === "github" ? `<div class="banner ok">Saved permanently in your ${esc(D.storage)}.</div>`
    : `<div class="banner warn"><b>Not connected to GitHub yet.</b> Changes are kept only until the server restarts or goes to sleep. Follow the setup steps to connect your private data repository.</div>`;
}
function render() { if (tab === "plans") plans(); else games(); }

// ---------- day plans ----------
function plans() {
  const P = D.plans;
  const gameOpts = D.games.map((g) => `<option value="${esc(g.id)}">${esc(g.title)}</option>`).join("");
  $m.innerHTML = `${banner()}<h1>Day plans</h1><p class="muted" style="margin-bottom:18px">A day plan is the list of games for one class, in order. On the host screen you pick a plan and the games run one after another.</p>
    <div id="plans">${P.map((p, pi) => `<div class="plan">
      <div class="grid2"><div class="f"><label>Name</label><input data-p="${pi}" data-k="name" value="${esc(p.name)}" placeholder="e.g. Week 3: Medieval"></div>
      <div class="f"><label>Add a game</label><div style="display:flex;gap:8px"><select data-add="${pi}"><option value="">Choose a game…</option>${gameOpts}</select></div></div></div>
      ${(p.games || []).map((e, ei) => { const g = D.games.find((x) => x.id === e.game); if (!g) return ""; const ok = g.questions.map((q, i) => (playable(g.type, q) ? i : -1)).filter((i) => i >= 0); const chosen = e.questions?.length ? e.questions : ok;
        return `<div class="entry"><span class="n">${ei + 1}</span><div><b>${esc(g.title)}</b> <span class="muted">· ${chosen.length} of ${ok.length} questions</span></div>
        <div class="tools"><button data-up="${pi}:${ei}">↑</button><button data-down="${pi}:${ei}">↓</button><button data-pick="${pi}:${ei}">Questions</button><button class="danger" data-del="${pi}:${ei}">Remove</button></div>
        <div class="qpick hidden" id="pick-${pi}-${ei}">${ok.map((i) => `<label title="${esc(qTitle(g, g.questions[i]))}"><input type="checkbox" data-q="${pi}:${ei}:${i}" ${chosen.includes(i) ? "checked" : ""}> ${i + 1}. ${esc(qTitle(g, g.questions[i]).slice(0, 34))}</label>`).join("")}</div></div>`; }).join("")}
      <div class="tools" style="margin-top:10px;justify-content:flex-end"><button class="danger" data-delplan="${pi}">Delete plan</button></div></div>`).join("")}</div>
    <div class="bar"><span class="status" id="status"></span><button class="ghost small" id="newplan">New day plan</button><button id="save">Save day plans</button></div>`;
  const mark = () => { dirty = true; document.getElementById("status").textContent = "Unsaved changes"; document.getElementById("status").className = "status err"; };
  $m.querySelectorAll("[data-k]").forEach((i) => (i.oninput = () => { P[i.dataset.p][i.dataset.k] = i.value; mark(); }));
  $m.querySelectorAll("[data-add]").forEach((s) => (s.onchange = () => { if (!s.value) return; (P[s.dataset.add].games ||= []).push({ game: s.value }); mark(); plans(); dirty = true; }));
  const ij = (s) => s.split(":").map(Number);
  $m.querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => { const [p, e] = ij(b.dataset.up); if (e > 0) { const g = P[p].games; [g[e - 1], g[e]] = [g[e], g[e - 1]]; plans(); dirty = true; } }));
  $m.querySelectorAll("[data-down]").forEach((b) => (b.onclick = () => { const [p, e] = ij(b.dataset.down); const g = P[p].games; if (e < g.length - 1) { [g[e + 1], g[e]] = [g[e], g[e + 1]]; plans(); dirty = true; } }));
  $m.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { const [p, e] = ij(b.dataset.del); P[p].games.splice(e, 1); plans(); dirty = true; }));
  $m.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => { const [p, e] = ij(b.dataset.pick); document.getElementById(`pick-${p}-${e}`).classList.toggle("hidden"); }));
  $m.querySelectorAll("[data-q]").forEach((c) => (c.onchange = () => { const [p, e] = ij(c.dataset.q); const box = [...$m.querySelectorAll(`[data-q^="${p}:${e}:"]`)]; P[p].games[e].questions = box.filter((x) => x.checked).map((x) => Number(x.dataset.q.split(":")[2])); mark(); }));
  $m.querySelectorAll("[data-delplan]").forEach((b) => (b.onclick = () => { const p = Number(b.dataset.delplan); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Click again to delete"; return; } P.splice(p, 1); plans(); dirty = true; }));
  document.getElementById("newplan").onclick = () => { P.push({ id: "plan-" + Math.random().toString(36).slice(2, 8), name: "New day plan", games: [] }); plans(); dirty = true; };
  document.getElementById("save").onclick = async () => {
    const s = document.getElementById("status"); s.textContent = "Saving…"; s.className = "status";
    try { await api("/api/admin/plans", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plans: P }) }); dirty = false; s.textContent = "Saved ✓"; }
    catch (e) { s.textContent = "Could not save: " + e.message; s.className = "status err"; }
  };
  if (dirty) mark();
}
function qTitle(g, q) { return q.prompt || q.category || q.posh || (q.clues || [])[0] || (q.steps || [])[0] || (q.items || []).map((i) => i.label).join(", ") || q.answer || "(empty)"; }

// ---------- games ----------
function games() {
  if (!curGame) curGame = D.games[0].id;
  const g = D.games.find((x) => x.id === curGame);
  $m.innerHTML = `${banner()}<div class="layout"><div class="list">${D.games.map((x) => { const bad = x.questions.filter((q) => !playable(x.type, q)).length; return `<button data-g="${esc(x.id)}" class="${x.id === curGame ? "on" : ""}"><span>${esc(x.title)}</span><small>${x.questions.length}${bad ? ` <span class="bad">· ${bad}!</span>` : ""}</small></button>`; }).join("")}</div>
    <div><div class="panel"><div class="grid2"><div class="f"><label>Title</label><input id="g-title" value="${esc(g.title)}"></div><div class="f"><label>Seconds per question</label><input id="g-time" type="number" min="10" max="600" value="${g.timeLimit}"></div></div>
      <div class="f"><label>Rules shown before the game</label><textarea id="g-intro">${esc(g.intro)}</textarea></div></div>
      <div id="qs">${g.questions.map((q, i) => qCard(g, q, i)).join("")}</div>
      <div class="bar"><span class="status" id="status"></span><button class="ghost small" id="addq">Add a question</button><button id="save">Save ${esc(g.title)}</button></div></div></div>`;
  $m.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { curGame = b.dataset.g; games(); }));
  const mark = () => { dirty = true; const s = document.getElementById("status"); s.textContent = "Unsaved changes"; s.className = "status err"; };
  document.getElementById("g-title").oninput = (e) => { g.title = e.target.value; mark(); };
  document.getElementById("g-time").oninput = (e) => { g.timeLimit = Math.max(10, Number(e.target.value) || 60); mark(); };
  document.getElementById("g-intro").oninput = (e) => { g.intro = e.target.value; mark(); };
  wireQuestions(g, mark);
  document.getElementById("addq").onclick = () => { g.questions.push(BLANK[g.type] ? BLANK[g.type]() : { answer: "", accept: [] }); mark(); games(); document.getElementById("qs").lastElementChild?.scrollIntoView({ behavior: "smooth" }); dirty = true; };
  document.getElementById("save").onclick = async () => {
    const s = document.getElementById("status"); s.textContent = "Saving…"; s.className = "status";
    try { const r = await api(`/api/admin/games/${g.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(g) }); dirty = false; s.textContent = `Saved ✓ · ${r.playable} questions ready to play`; }
    catch (e) { s.textContent = "Could not save: " + e.message; s.className = "status err"; }
  };
  if (dirty) mark();
}
function qCard(g, q, i) {
  const why = missing(g.type, q);
  return `<div class="q ${why ? "bad" : ""}" id="q-${i}"><div class="qh"><b>Question ${i + 1}</b>${why ? `<span class="tag">${esc(why)}</span>` : ""}<div class="tools"><button data-mv="${i}:-1">↑</button><button data-mv="${i}:1">↓</button><button class="danger" data-rm="${i}">Delete</button></div></div>
    ${q.note ? `<p class="muted" style="margin:0 0 10px">Note: ${esc(q.note)}</p>` : ""}
    ${SCHEMA[g.type].map((f) => field(g, q, i, f)).join("")}</div>`;
}
function field(g, q, i, f) {
  const v = get(q, f.path), id = `f-${i}-${f.path.replace(/\./g, "_")}`;
  const lab = `<label for="${id}">${esc(f.label)}</label>${f.help ? `<small>${esc(f.help)}</small>` : ""}`;
  if (f.kind === "textarea") return `<div class="f">${lab}<textarea id="${id}" data-i="${i}" data-path="${f.path}">${esc(v)}</textarea></div>`;
  if (f.kind === "list") return `<div class="f">${lab}<input id="${id}" data-i="${i}" data-path="${f.path}" data-kind="list" value="${esc((v || []).join(", "))}"></div>`;
  if (f.kind === "lines") return `<div class="f">${lab}<textarea id="${id}" data-i="${i}" data-path="${f.path}" data-kind="lines" style="min-height:${f.path === "answers" ? 9 : 7}em">${esc((v || []).join("\n"))}</textarea></div>`;
  if (f.kind === "number") return `<div class="f">${lab}<input id="${id}" type="number" step="any" data-i="${i}" data-path="${f.path}" data-kind="number" value="${esc(v)}"></div>`;
  if (f.kind === "image" || f.kind === "audio") return `<div class="f">${lab}<div class="media">${v ? (f.kind === "image" ? `<img src="/media/${esc(v)}" alt="">` : `<audio controls src="/media/${esc(v)}"></audio>`) : `<span class="muted">None</span>`}<input type="file" accept="${f.kind === "image" ? "image/*" : "audio/*"}" data-up="${i}:${f.path}" style="width:auto">${v ? `<button class="small danger" data-clear="${i}:${f.path}">Remove</button>` : ""}</div></div>`;
  if (f.kind === "markers") return `<div class="f">${lab}${q.image ? `<div class="mkwrap" data-mk="${i}"><img src="/media/${esc(q.image)}" alt="">${(q.markers || []).map((m) => `<span class="mk ${String(m.n) === String(q.answer) ? "right" : ""}" data-mn="${i}:${m.n}" style="left:${m.x}%;top:${m.y}%">${m.n}</span>`).join("")}</div>
      <div class="f" style="margin-top:10px"><label for="ans-${i}">The right number</label><select id="ans-${i}" data-ans="${i}"><option value="">Choose…</option>${(q.markers || []).map((m) => `<option ${String(m.n) === String(q.answer) ? "selected" : ""}>${m.n}</option>`).join("")}</select></div>` : `<span class="muted">Upload a picture first.</span>`}</div>`;
  if (f.kind === "items") return `<div class="f">${lab}<div class="items">${(q.items || []).map((it, k) => `<div class="it"><input data-it="${i}:${k}:label" value="${esc(it.label)}" placeholder="Event"><input data-it="${i}:${k}:year" type="number" value="${esc(it.year)}" placeholder="Year (BC = minus)"><button class="small danger" data-itrm="${i}:${k}">×</button></div>`).join("")}</div><button class="small" data-itadd="${i}" style="align-self:flex-start;margin-top:6px">Add an event</button></div>`;
  return `<div class="f">${lab}<input id="${id}" data-i="${i}" data-path="${f.path}" value="${esc(v)}"></div>`;
}
function wireQuestions(g, mark) {
  const Q = g.questions, refresh = (i) => { const el = document.getElementById(`q-${i}`); el.outerHTML = qCard(g, Q[i], i); wireQuestions(g, mark); };
  $m.querySelectorAll("[data-path]").forEach((el) => (el.oninput = () => {
    const i = Number(el.dataset.i), k = el.dataset.kind; let v = el.value;
    if (k === "list") v = v.split(",").map((x) => x.trim()).filter(Boolean);
    if (k === "lines") v = v.split("\n").map((x) => x.trim()).filter(Boolean);
    if (k === "number") v = v === "" ? "" : Number(v);
    set(Q[i], el.dataset.path, v); mark();
    const card = document.getElementById(`q-${i}`), why = missing(g.type, Q[i]); card.classList.toggle("bad", !!why);
  }));
  $m.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => { const [i, d] = b.dataset.mv.split(":").map(Number); const j = i + d; if (j < 0 || j >= Q.length) return; [Q[i], Q[j]] = [Q[j], Q[i]]; mark(); games(); }));
  $m.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Sure?"; return; } Q.splice(Number(b.dataset.rm), 1); mark(); games(); }));
  $m.querySelectorAll("[data-up]").forEach((inp) => (inp.onchange = async () => {
    const [i, path] = inp.dataset.up.split(/:(.+)/); const file = inp.files[0]; if (!file) return;
    const s = document.getElementById("status"); s.textContent = "Uploading…"; s.className = "status";
    try { const r = await api(`/api/admin/media?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file }); set(Q[i], path, r.name); if (path === "audio") delete Q[i].needs; mark(); refresh(Number(i)); }
    catch (e) { s.textContent = "Upload failed: " + e.message; s.className = "status err"; }
  }));
  $m.querySelectorAll("[data-clear]").forEach((b) => (b.onclick = () => { const [i, path] = b.dataset.clear.split(/:(.+)/); set(Q[i], path, ""); mark(); refresh(Number(i)); }));
  $m.querySelectorAll("[data-mk]").forEach((w) => (w.onclick = (e) => {
    const i = Number(w.dataset.mk);
    if (e.target.dataset.mn) { const n = Number(e.target.dataset.mn.split(":")[1]); Q[i].markers = Q[i].markers.filter((m) => m.n !== n); if (String(Q[i].answer) === String(n)) Q[i].answer = null; }
    else { const r = w.querySelector("img").getBoundingClientRect(); const x = Math.round((e.clientX - r.left) / r.width * 1000) / 10, y = Math.round((e.clientY - r.top) / r.height * 1000) / 10; const n = Math.max(0, ...(Q[i].markers || []).map((m) => m.n)) + 1; (Q[i].markers ||= []).push({ n, x, y }); }
    mark(); refresh(i);
  }));
  $m.querySelectorAll("[data-ans]").forEach((s) => (s.onchange = () => { const i = Number(s.dataset.ans); Q[i].answer = s.value ? Number(s.value) : null; mark(); refresh(i); }));
  $m.querySelectorAll("[data-it]").forEach((el) => (el.oninput = () => { const [i, k, key] = el.dataset.it.split(":"); Q[i].items[k][key] = key === "year" ? (el.value === "" ? "" : Number(el.value)) : el.value; mark(); }));
  $m.querySelectorAll("[data-itrm]").forEach((b) => (b.onclick = () => { const [i, k] = b.dataset.itrm.split(":").map(Number); Q[i].items.splice(k, 1); mark(); refresh(i); }));
  $m.querySelectorAll("[data-itadd]").forEach((b) => (b.onclick = () => { const i = Number(b.dataset.itadd); (Q[i].items ||= []).push({ label: "", year: "" }); mark(); refresh(i); }));
}
if (PW) load(); else login();
</script>
</body>
</html>
